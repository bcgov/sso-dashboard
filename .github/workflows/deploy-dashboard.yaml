name: Publish SSO Grafana helm chart

on:
  # workflow_dispatch:
  push:
    branches:
    - main
    - dev
    paths:
    - helm/grafana/**
    - .github/workflows/deploy-dashboard.yaml

jobs:
  helm-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Install CLI tools from OpenShift Mirror
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        source: mirror
        kam: latest
        oc: 4.18.7

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Set env to Sandbox
      if: (github.ref == 'refs/heads/dev' && github.event_name == 'push')
      run: |
        cat >> $GITHUB_ENV <<EOF
        OPENSHIFT_TOKEN=${{ secrets.SANDBOX_OPENSHIFT_TOKEN }}
        OPENSHIFT_SERVER=${{ secrets.SANDBOX_OPENSHIFT_SERVER }}
        OPENSHIFT_NAMESPACE=e4ca1d-tools
        EOF

    - name: Set env to Production
      if: (github.ref == 'refs/heads/main' && github.event_name == 'push')
      run: |
        cat >> $GITHUB_ENV <<EOF
        OPENSHIFT_TOKEN=${{ secrets.PROD_OPENSHIFT_TOKEN }}
        OPENSHIFT_SERVER=${{ secrets.PROD_OPENSHIFT_SERVER }}
        OPENSHIFT_NAMESPACE=eb75ad-tools
        EOF

    - name: Authenticate and set context
      uses: redhat-actions/oc-login@v1
      with:
        openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
        openshift_token: ${{ env.OPENSHIFT_TOKEN }}
        namespace: ${{ env.OPENSHIFT_NAMESPACE }}

    - name: Load Grafana secrets from OpenShift
      run: |
        set -euo pipefail
        secret_json=$(oc get secret sso-grafana-ghaction-env \
          -n "${{ env.OPENSHIFT_NAMESPACE }}" -o json)

        for key in $(jq -r '.data | keys[]' <<< "$secret_json"); do
          value=$(jq -r --arg k "$key" '.data[$k]' <<< "$secret_json" | base64 -d)
          # Mask before it ever hits stdout/GITHUB_ENV so it can't leak into logs
          echo "::add-mask::${value}"
          echo "${key}=${value}" >> "$GITHUB_ENV"
        done

        unset secret_json value

    - name: Deploy grafana with Helm chart
      run: |
        namespace=${{ env.OPENSHIFT_NAMESPACE }}
        make upgrade NAMESPACE=${{ env.OPENSHIFT_NAMESPACE }}
      working-directory: ./helm/grafana
